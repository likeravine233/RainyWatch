name: test

on:
  push:
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts:跳过 electron postinstall 的二进制下载;纯函数测试链(lib/*,src/phase)不依赖它
      - run: npm ci --ignore-scripts
      - run: npm test

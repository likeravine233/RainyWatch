name: 界面/主题问题 / UI or theme issue
description: 元素重叠/打架、错位、裁切、字体异常等显示类问题 / Overlapping, misplaced or clipped elements, font issues
labels: ["ui"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈!显示类问题要能复现才好修,**有效反馈三要素**:
        1. **截图必须有**——提交后可以直接把截图拖进 issue 正文;
        2. **窗口大小要说**——拖到多大出的问题(迷你/小/标准/大窗,或大概宽度);
        3. **能复现**——做了什么操作、切到哪个主题、哪个页面出的问题。
        从应用内点进来时,版本/主题/窗口/字号等环境信息已自动附在「环境信息」栏,直接补充缺失部分即可。
        Thanks for the report! Display issues need to be reproducible — three things help most:
        1. **A screenshot** — you can drag it into the issue body after submitting;
        2. **The window size** — how large the window was when it happened (mini/small/standard/large, or rough width);
        3. **Steps to reproduce** — what you did, which theme, which page.
        When opened from inside the app, version/theme/window/font info is auto-filled in the "Environment" field.
  - type: input
    id: env
    attributes:
      label: 环境信息 / Environment
      description: 应用自动预填,可补充修正 / Auto-filled by the app; feel free to correct or extend
  - type: dropdown
    id: theme
    attributes:
      label: 主题 / Theme
      description: 出问题的主题(可提交后在正文补充多主题对比图) / The theme with the problem (you can add comparison screenshots later)
      options:
        - 蓝色平台 / Blue Platform
        - 战术沙盘 / Tactical
        - 透明 / Clear
        - 队色对撞 / Versus
        - 磷光终端 / Phosphor CRT
        - 期刊海报 / Poster
        - 印花集 / Printstream
        - 多个主题都有 / Multiple themes
        - 其他/不确定 / Other / Not sure
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 界面位置 / UI area
      options:
        - 主卡 / Hero card
        - 比赛列表 / Match list
        - 变阵列表 / Transfers
        - 赛事页 / Events
        - 迷你条 / Mini bar
        - 设置页 / Settings
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 哪个元素和哪个元素打架 / Which elements clash
      description: 什么元素与什么元素重叠/错位/被裁切,在什么条件下出现 / Which element overlaps/misplaces/clips which, and under what conditions
      placeholder: "例:标准窗口 + 字号 125% 时,图序带与阶段胶囊行重叠;窗口拉到最小宽度时倒计时被裁掉…… / e.g. at standard width + 125% font scale the map strip overlaps the phase chips; the countdown gets clipped at minimum width..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 从启动/换主题开始,一步一步怎么操作会出现 / Starting from launch or a theme switch, step by step
      placeholder: "例:1. 主题切到磷光终端 2. 字号调到 125% 3. 打开即将开始分区…… / e.g. 1. switch to Phosphor CRT 2. set font scale 125% 3. open the upcoming section..."
    validations:
      required: true
